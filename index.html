<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="仁愛國小與建安國小校內消息彙整"><title>國小消息牆</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="hero"><div class="wrap"><p class="eyebrow">ELEMENTARY SCHOOL NEWS</p><div id="schoolSwitch" class="school-switch" role="tablist" aria-label="選擇學校"></div><h1 id="schoolTitle">仁愛國小<br><em>消息牆</em></h1><p class="intro">校內公告、家長資訊與教育消息，集中在這裡快速查看。</p><p id="updated" class="updated">資料載入中…</p></div></header>
<main class="wrap"><div id="filters" class="filters" aria-label="消息分類"></div><section id="feed" class="feed" aria-live="polite"><p class="loading">正在整理最新消息…</p></section></main><footer class="wrap"><span>資料來源：仁愛國小、建安國小、臺北市教育局</span><a href="https://github.com/Neil-Lin/japs-school-news">GitHub</a></footer>
<script>
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Intl.DateTimeFormat('zh-TW',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Taipei'}).format(new Date(v)):'時間未提供';let activeSchool='仁愛國小';fetch('data/articles.json?v='+Date.now()).then(r=>r.json()).then(data=>{document.querySelector('#updated').textContent=data.updatedAt?'最後更新｜'+fmt(data.updatedAt):'尚未更新';const schools=['仁愛國小','建安國小'];const switcher=document.querySelector('#schoolSwitch');const render=()=>{switcher.innerHTML=schools.map(s=>`<button class="school-tab ${s===activeSchool?'active':''}" aria-selected="${s===activeSchool}" data-school="${s}">${s}</button>`).join('');document.querySelectorAll('.school-tab').forEach(b=>b.onclick=()=>{activeSchool=b.dataset.school;render()});document.querySelector('#schoolTitle').innerHTML=activeSchool+'<br><em>消息牆</em>';const visible=data.articles.filter(a=>(a.schools||['仁愛國小']).includes(activeSchool));const groups=[...new Set(visible.map(a=>a.source))];let active='全部';document.querySelector('#filters').innerHTML=['全部',...groups].map(g=>`<button class="filter ${g===active?'active':''}" data-source="${esc(g)}">${esc(g)}</button>`).join('');const paint=()=>{document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.source===active));const list=visible.filter(a=>active==='全部'||a.source===active);document.querySelector('#feed').innerHTML=list.length?list.map(a=>`<article class="card"><div class="meta"><span class="tag">${esc(a.source)}</span><time>${esc(fmt(a.published))}</time></div><h2>${esc(a.title)}</h2>${a.url?`<a class="read" href="${esc(a.url)}" target="_blank" rel="noopener">閱讀公告 <span>↗</span></a>`:`<p class="summary">${esc(a.summary||'沒有可顯示的內容。')}</p>`}</article>`).join(''):'<p class="empty">目前沒有可顯示的消息。</p>'};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{active=b.dataset.source;paint()});paint()};render()}).catch(()=>document.querySelector('#feed').innerHTML='<p class="empty">暫時無法載入消息資料，請稍後再試。</p>');
</script></body></html>
