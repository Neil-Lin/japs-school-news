name: Set up project runtimes
description: Shared Node and Python versions for checks, RSS generation and packaging.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        package-manager-cache: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
