name: Update RSS and deploy Pages
on:
  schedule:
    # GitHub Actions uses UTC here: 02:30 UTC = 10:30 Taiwan, 08:30 UTC = 16:30 Taiwan.
    - cron: "30 2 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  update-and-deploy:
    # The scheduled run already deploys after updating data; skip the push event it creates.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Validate project files
        run: |
          python -m json.tool config.json >/dev/null
          python -m json.tool data/articles.json >/dev/null
          python -m json.tool data/version.json >/dev/null
          node --check app.js
          python scripts/validate_project.py
      - name: Update RSS data
        run: python scripts/update_feed.py
      - name: Validate updated data
        run: python scripts/validate_project.py
      - name: Save latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/version.json
          git diff --cached --quiet || git commit -m "chore: update school news"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: "."}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
