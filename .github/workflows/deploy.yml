name: Deploy Pages
"on":
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN commits do not trigger push workflows; completion does.
  workflow_run:
    workflows: [Update RSS data, Update lunch data]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always use trusted, current main. Do not consume an upstream build artifact.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Record the exact source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate the committed snapshot without fetching RSS
        run: python scripts/check_project.py
      - name: Build an explicit public package
        run: python scripts/build_site.py --output dist
      - name: Record expected public response hashes
        run: python scripts/verify_deployment.py --prepare dist --output reports/deploy-expected.json
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-expectations
          path: reports/deploy-expected.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the validated public artifact
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry Pages deployment once
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: deploy-expectations
          path: reports
      - name: Verify all published pages, assets and data against this deployment
        run: python scripts/verify_deployment.py --expected reports/deploy-expected.json --base-url https://neil-lin.github.io/japs-school-news/ --output reports/deploy-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-verification
          path: reports/
          retention-days: 30
