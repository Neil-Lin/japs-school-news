name: Update RSS data
run-name: RSS · ${{ github.event_name }} · ${{ github.event.schedule || inputs.check_mode || 'manual' }}
"on":
  schedule:
    - cron: '30 10 * * *'
      timezone: Asia/Taipei
    - cron: '30 16 * * *'
      timezone: Asia/Taipei
    # One fallback opportunity per slot: Taiwan 11:40/17:40.
    - cron: '40 11 * * *'
      timezone: Asia/Taipei
    - cron: '40 17 * * *'
      timezone: Asia/Taipei
  workflow_dispatch:
    inputs:
      check_mode:
        description: Manual read, or exercise the fallback freshness guard
        type: choice
        default: manual
        options: [manual, fallback-check]
permissions:
  contents: write
concurrency:
  group: rss-update-main
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/setup
      - name: Check code and the current snapshot without fetching sources
        run: python scripts/check_project.py
      - name: Identify the slot and skip already covered source reads
        id: plan
        env:
          RSS_EVENT: ${{ github.event_name }}
          RSS_CRON: ${{ github.event.schedule }}
          RSS_MODE: ${{ inputs.check_mode || 'manual' }}
        run: python scripts/rss_schedule.py --gate
      - name: Fetch RSS and publish a validated snapshot
        if: steps.plan.outputs.run_update == 'true'
        env:
          FEED_ATTEMPT_REPORT: reports/feed-attempt.json
        run: python scripts/update_feed.py
      - name: Report source health without blocking a valid partial snapshot
        if: always()
        continue-on-error: true
        env:
          FEED_ATTEMPT_REPORT: reports/feed-attempt.json
        run: node scripts/health_report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rss-health
          path: reports/
          retention-days: 30
      - name: Validate the new snapshot and school artifacts
        if: steps.plan.outputs.run_update == 'true'
        run: python scripts/validate_project.py
      - name: Save only generated data
        if: steps.plan.outputs.run_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/version.json data/schools
          if ! git diff --cached --quiet; then
            git commit -m "chore: update school news"
            git push origin HEAD:main
          fi
