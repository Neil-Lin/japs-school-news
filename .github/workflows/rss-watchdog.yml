name: RSS schedule watchdog
"on":
  schedule:
    # Taiwan 12:13/18:13, after primary + fallback + publication grace.
    - cron: '13 4 * * *'
    - cron: '13 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rss-watchdog-main
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Detect missing primary runs, overdue sources and publication lag
        env:
          GH_TOKEN: ${{ github.token }}
          RSS_WATCHDOG_CRON: ${{ github.event.schedule }}
        run: python scripts/rss_schedule.py --watchdog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rss-watchdog
          path: reports/rss-watchdog.*
          retention-days: 30
