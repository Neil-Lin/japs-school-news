name: Maintenance health
"on":
  schedule:
    - cron: '15 0 * * *'
    - cron: '45 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    if: github.event_name != 'schedule' || github.event.schedule == '15 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate the published data contracts
        run: python scripts/check_project.py
      - name: Check freshness and independent school review dates
        run: node scripts/health_report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-health
          path: reports/
          retention-days: 30
  school-sources:
    if: github.event_name != 'schedule' || github.event.schedule == '45 0 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Compare public school source rows without changing reviewed content
        run: python scripts/check_school_info_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-source-comparison
          path: reports/
          retention-days: 30
